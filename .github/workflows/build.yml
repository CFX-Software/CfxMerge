name: Build Check

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    name: Build Application
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Application (No Installer)
        run: |
          wails build -clean

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfxmerge-build-${{ github.sha }}
          path: build/bin/CfxMerge.exe
          retention-days: 7
